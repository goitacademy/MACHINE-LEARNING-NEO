# Conda variant of pyproject.toml: same top-level versions as uv.lock / requirements_pip.txt.
# prosphera is not on conda-forge, so it is installed with pip.
name: env_mlf
channels:
  - conda-forge
dependencies:
  - python=3.13
  - numpy=2.5.4
  - pandas=3.1.1
  - scipy=1.18.1
  - matplotlib=3.11.2
  - seaborn=0.13.2
  - scikit-learn=1.9.1
  - statsmodels=0.15.0
  - imbalanced-learn=0.14.2
  - category_encoders=2.11.2
  - prophet=1.5.0
  - sweetviz=2.3.3
  - kneed=0.9.0
  - mlflow=3.18.0
  - joblib=1.6.0
  - ipykernel=7.4.0
  - ipywidgets=8.1.9
  - jupyterlab=4.6.6
  - pip
  - pip:
      - prosphera==1.0.5
