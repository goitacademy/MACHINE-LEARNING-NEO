# Conda variant of pyproject.toml: same top-level versions as uv.lock / requirements_pip.txt.
# prosphera and xgboost-cpu are not on conda-forge and shap 0.54.1 is not there yet,
# so they are installed with pip; xgboost-cpu has no macOS wheels, so macOS gets
# the full xgboost package.
name: env_mlf
channels:
  - conda-forge
dependencies:
  - python=3.13
  - numpy=2.5.4
  - pandas=3.1.1
  - scipy=1.18.1
  - matplotlib=3.11.2
  - seaborn=0.13.2
  - scikit-learn=1.9.1
  - statsmodels=0.15.0
  - imbalanced-learn=0.14.2
  - category_encoders=2.11.2
  - lightgbm=4.7.0
  - prophet=1.5.0
  - sweetviz=2.3.3
  - kneed=0.9.0
  - mlflow=3.18.0
  - fastapi=0.162.4
  - uvicorn=0.54.0
  - streamlit=1.67.0
  - requests=2.34.2
  - joblib=1.6.0
  - ipykernel=7.4.0
  - ipywidgets=8.1.9
  - jupyterlab=4.6.6
  - pip
  - pip:
      - prosphera==1.0.5
      - xgboost-cpu==3.4.1; sys_platform != 'darwin'
      - xgboost==3.4.1; sys_platform == 'darwin'
      - shap==0.54.1
